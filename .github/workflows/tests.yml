name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python -m pip install -e .
      - name: Compile and run tests
        run: |
          python -m compileall -q excel_copy.py excel_copy_script tests
          python -m unittest discover -s tests -v
      - name: Test real Tk mouse selection and scrolling
        run: |
          timeout 30s xvfb-run -a python -m unittest discover -s gui_tests -v
      - name: Verify installed entry point
        run: |
          python -c 'from importlib.metadata import distribution; d = distribution("excel-copy-script"); assert any(e.name == "excel-copy-script" and e.value == "excel_copy_script.gui:main" for e in d.entry_points)'
